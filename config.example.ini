; Daily Checks settings — shared by everyone on this PC.
; Copy this file to config.ini (same folder as allinone.exe) and fill it in.
; Write values as-is: no quotes, and $ % " are fine in passwords.

[cnom]
username = shared_cnom_username
password = shared_cnom_password

[metabase]
username = shared_metabase_username
password = shared_metabase_password

[email]
brevo_api_key = your_brevo_api_key
; must be the sender address verified in Brevo
from = verified_sender@company.com
; the address that receives the reports
to = receiver@company.com

; Optional: Brevo SMTP login (Brevo -> SMTP & API -> SMTP tab). When both
; are filled in, the graphs appear inside the email body instead of as
; attachments. Leave empty to keep sending with brevo_api_key only.
smtp_login =
smtp_key =
